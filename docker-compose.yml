# One-command local stack: docker compose up --build
# Then seed demo data: docker compose run --rm -e SEED_FORCE=true api pnpm exec tsx prisma/seed/index.ts
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: akere
      POSTGRES_PASSWORD: akere
      POSTGRES_DB: akere
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akere"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

  api:
    build: { context: ., dockerfile: Dockerfile.api }
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://akere:akere@postgres:5432/akere
      APP_URL: http://localhost:3000
      DEMO_MODE: "true"
      SIGNING_MASTER_KEY: ${SIGNING_MASTER_KEY:?set SIGNING_MASTER_KEY in .env (openssl rand -hex 32)}
      # Files are stored on the `files` volume. For production S3 set STORAGE_DRIVER=s3 and S3_* (see apps/api/.env.example).
      STORAGE_DRIVER: local
      STORAGE_DIR: /data/files
      SMTP_URL: smtp://mailpit:1025
      COOKIE_SECURE: "false"
      # web → api goes through the Next.js rewrite, which appends the client IP to X-Forwarded-For (one hop).
      # In production do not publish :4000; expose only the web/reverse proxy.
      TRUST_PROXY: "1"
    volumes: [files:/data/files]
    ports: ["4000:4000"]

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args: { API_URL: "http://api:4000" }
    depends_on: [api]
    environment:
      API_URL: http://api:4000
    ports: ["3000:3000"]

volumes:
  pgdata:
  files:
